name: UI CI

on:
  push:
  pull_request:

jobs:
  build-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Debug repo root
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name pom.xml -print

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify UI with Maven
        run: |
          if [ -f "ui/pom.xml" ]; then
            cd ui
          elif [ -f "AUCTION_PROJECT-feature-ui/ui/pom.xml" ]; then
            cd AUCTION_PROJECT-feature-ui/ui
          else
            echo "Cannot find UI pom.xml"
            find . -maxdepth 4 -name pom.xml -print
            exit 1
          fi

          mvn -B clean verify
