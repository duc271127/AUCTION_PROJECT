name: Backend CI - JUnit Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Maven verify
        run: |
          cd backend
          mvn -B clean verify \
            -Dspring.profiles.active=test
