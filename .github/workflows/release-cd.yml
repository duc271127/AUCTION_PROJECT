name: Release CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  server:
    name: Build Server Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build server
        run: mvn -B -f server/pom.xml clean verify -Dspring.profiles.active=test

      - name: Prepare server bundle
        shell: pwsh
        run: |
          $dist = "dist/server"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $jar = Get-ChildItem "server/target" -Filter "*.jar" |
            Where-Object { $_.Name -notlike "original-*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $jar) {
            throw "Server jar not found in server/target"
          }

          Copy-Item $jar.FullName "$dist/auction-server.jar"
          Copy-Item "server/src/main/resources/application.properties" "$dist/application.properties"

          @'
          Auction Server Bundle
          =====================

          Requirements
          - Java 21

          Run
          - Windows: run-server.cmd
          - Linux/macOS: ./run-server.sh

          Configuration
          - Edit application.properties in this folder
          - Or override with environment variables such as:
            AUCTION_DB_URL
            AUCTION_DB_USERNAME
            AUCTION_DB_PASSWORD
            AUCTION_SERVER_ADDRESS
            AUCTION_SERVER_PORT
          '@ | Set-Content "$dist/README.txt"

          @'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          java -jar "$SCRIPT_DIR/auction-server.jar" --spring.config.location="$SCRIPT_DIR/application.properties"
          '@ | Set-Content "$dist/run-server.sh"

          @'
          @echo off
          set SCRIPT_DIR=%~dp0
          java -jar "%SCRIPT_DIR%auction-server.jar" --spring.config.location="%SCRIPT_DIR%application.properties"
          set EXIT_CODE=%ERRORLEVEL%
          if not "%EXIT_CODE%"=="0" (
            echo.
            echo Server exited with code %EXIT_CODE%.
            echo Check that Java 21 is installed and available in PATH.
            pause
          )
          exit /b %EXIT_CODE%
          '@ | Set-Content "$dist/run-server.cmd"

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: dist/server
          if-no-files-found: error
          retention-days: 14

  client:
    name: Build Client Bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build client and copy dependencies
        run: mvn -B -f client/pom.xml clean package dependency:copy-dependencies

      - name: Prepare client bundle
        shell: pwsh
        run: |
          $dist = "dist/client-${{ matrix.label }}"
          $appDir = Join-Path $dist "app"
          $libDir = Join-Path $dist "lib"

          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null

          $jar = Get-ChildItem "client/target" -Filter "*.jar" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $jar) {
            throw "Client jar not found in client/target"
          }

          if (-not (Test-Path "client/target/dependency")) {
            throw "Client dependency directory not found in client/target/dependency"
          }

          Copy-Item $jar.FullName "$appDir/auction-client.jar"
          Copy-Item "client/target/dependency/*" $libDir -Recurse
          Copy-Item "client/src/main/resources/auction-client.properties" "$dist/auction-client.properties"

          @'
          Auction Client Bundle
          =====================

          Requirements
          - Java 21
          - Use the bundle built for your operating system

          Run
          - Windows: run-client.cmd
          - Linux/macOS: ./run-client.sh

          Default server
          - This bundle keeps the repository default server endpoint from auction-client.properties
          - If your team is still using the current shared server, you can run it as-is

          Configuration override
          - Edit auction-client.properties in this folder if the server URL changes
          - Or override with environment variables:
            AUCTION_API_BASE_URL
            AUCTION_WS_URL
          '@ | Set-Content "$dist/README.txt"

          @'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          java -cp "$SCRIPT_DIR:$SCRIPT_DIR/app/auction-client.jar:$SCRIPT_DIR/lib/*" com.auction.client.MainApp
          '@ | Set-Content "$dist/run-client.sh"

          @'
          @echo off
          set SCRIPT_DIR=%~dp0
          java -cp "%SCRIPT_DIR%;%SCRIPT_DIR%app\auction-client.jar;%SCRIPT_DIR%lib\*" com.auction.client.MainApp
          set EXIT_CODE=%ERRORLEVEL%
          if not "%EXIT_CODE%"=="0" (
            echo.
            echo Client exited with code %EXIT_CODE%.
            echo Common causes:
            echo 1. Java 21 is not installed
            echo 2. Java is not in PATH
            echo 3. The zip was not fully extracted before running
            pause
          )
          exit /b %EXIT_CODE%
          '@ | Set-Content "$dist/run-client.cmd"

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.label }}-dist
          path: dist/client-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - server
      - client
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Archive bundles
        run: |
          find release-assets -type f -name "*.sh" -exec chmod +x {} +
          cd release-assets
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/server-dist.zip
            release-assets/client-linux-dist.zip
            release-assets/client-windows-dist.zip
