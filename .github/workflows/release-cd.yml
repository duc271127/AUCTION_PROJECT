name: Release CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  backend:
    name: Build Backend Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build backend
        run: mvn -B -f backend/pom.xml clean verify -Dspring.profiles.active=test

      - name: Prepare backend bundle
        shell: pwsh
        run: |
          $dist = "dist/backend"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $jar = Get-ChildItem "backend/target" -Filter "*.jar" |
            Where-Object { $_.Name -notlike "original-*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $jar) {
            throw "Backend jar not found in backend/target"
          }

          Copy-Item $jar.FullName "$dist/backend.jar"
          Copy-Item "backend/src/main/resources/application.properties" "$dist/application.properties"

          @'
          Auction Backend Bundle
          ======================

          Requirements
          - Java 21

          Run
          - Windows: run-backend.cmd
          - Linux/macOS: ./run-backend.sh

          Configuration
          - Edit application.properties in this folder
          - Or override with environment variables such as:
            AUCTION_DB_URL
            AUCTION_DB_USERNAME
            AUCTION_DB_PASSWORD
            AUCTION_SERVER_ADDRESS
            AUCTION_SERVER_PORT
          '@ | Set-Content "$dist/README.txt"

          @'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          java -jar "$SCRIPT_DIR/backend.jar" --spring.config.location="$SCRIPT_DIR/application.properties"
          '@ | Set-Content "$dist/run-backend.sh"

          @'
          @echo off
          set SCRIPT_DIR=%~dp0
          java -jar "%SCRIPT_DIR%backend.jar" --spring.config.location="%SCRIPT_DIR%application.properties"
          set EXIT_CODE=%ERRORLEVEL%
          if not "%EXIT_CODE%"=="0" (
            echo.
            echo Backend exited with code %EXIT_CODE%.
            echo Check that Java 21 is installed and available in PATH.
            pause
          )
          exit /b %EXIT_CODE%
          '@ | Set-Content "$dist/run-backend.cmd"

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/backend
          if-no-files-found: error
          retention-days: 14

  ui:
    name: Build UI Bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build UI and copy dependencies
        run: mvn -B -f ui/pom.xml clean package dependency:copy-dependencies

      - name: Prepare UI bundle
        shell: pwsh
        run: |
          $dist = "dist/ui-${{ matrix.label }}"
          $appDir = Join-Path $dist "app"
          $libDir = Join-Path $dist "lib"

          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null

          $jar = Get-ChildItem "ui/target" -Filter "*.jar" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $jar) {
            throw "UI jar not found in ui/target"
          }

          if (-not (Test-Path "ui/target/dependency")) {
            throw "UI dependency directory not found in ui/target/dependency"
          }

          Copy-Item $jar.FullName "$appDir/auction-ui.jar"
          Copy-Item "ui/target/dependency/*" $libDir -Recurse
          Copy-Item "ui/src/main/resources/auction-client.properties" "$dist/auction-client.properties"

          @'
          Auction UI Bundle
          =================

          Requirements
          - Java 21
          - Use the bundle built for your operating system

          Run
          - Windows: run-ui.cmd
          - Linux/macOS: ./run-ui.sh

          Default server
          - This bundle keeps the repository default backend endpoint from auction-client.properties
          - If your team is still using the current shared server, you can run it as-is

          Configuration override
          - Edit auction-client.properties in this folder if the backend URL changes
          - Or override with environment variables:
            AUCTION_API_BASE_URL
            AUCTION_WS_URL
          '@ | Set-Content "$dist/README.txt"

          @'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          java -cp "$SCRIPT_DIR:$SCRIPT_DIR/app/auction-ui.jar:$SCRIPT_DIR/lib/*" com.auction.client.MainApp
          '@ | Set-Content "$dist/run-ui.sh"

          @'
          @echo off
          set SCRIPT_DIR=%~dp0
          java -cp "%SCRIPT_DIR%;%SCRIPT_DIR%app\auction-ui.jar;%SCRIPT_DIR%lib\*" com.auction.client.MainApp
          set EXIT_CODE=%ERRORLEVEL%
          if not "%EXIT_CODE%"=="0" (
            echo.
            echo UI exited with code %EXIT_CODE%.
            echo Common causes:
            echo 1. Java 21 is not installed
            echo 2. Java is not in PATH
            echo 3. The zip was not fully extracted before running
            pause
          )
          exit /b %EXIT_CODE%
          '@ | Set-Content "$dist/run-ui.cmd"

      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.label }}-dist
          path: dist/ui-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - backend
      - ui
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Archive bundles
        run: |
          find release-assets -type f -name "*.sh" -exec chmod +x {} +
          cd release-assets
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/backend-dist.zip
            release-assets/ui-linux-dist.zip
            release-assets/ui-windows-dist.zip
