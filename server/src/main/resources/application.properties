spring.datasource.url=${AUCTION_DB_URL:jdbc:h2:file:./data/auctiondb;MODE=PostgreSQL}
spring.datasource.username=${AUCTION_DB_USERNAME:sa}
spring.datasource.password=${AUCTION_DB_PASSWORD:}
server.address=${AUCTION_SERVER_ADDRESS:0.0.0.0}
server.port=${AUCTION_SERVER_PORT:${PORT:8081}}

spring.datasource.driver-class-name=${AUCTION_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${AUCTION_SHOW_SQL:false}
spring.jpa.open-in-view=false
app.upload.dir=${AUCTION_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.jwt.secret=${AUCTION_JWT_SECRET:auction-project-local-secret-key-change-before-production}
app.jwt.expiration-seconds=86400
